name: Android CI/CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code & Git LFS Assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew app:assembleDebug --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qurafy-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Qurafy-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Extract App Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.1")
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log -n 15 --pretty=format:"- %s" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: Qurafy v${{ steps.get_version.outputs.version_name }}
          body: |
            ## Qurafy Quran Reader App 📖
            
            ### Package Information
            - **Version**: ${{ steps.get_version.outputs.version_name }}
            - **Target SDK**: Android 11+ (API 30–36)
            
            ### 📝 Changelog
            ${{ steps.changelog.outputs.changelog }}
            
            ### Features
            - Authentic `quran-roman-urdu-hindi.pdf` rendering with LRU bitmap caching.
            - Interactive pencil marking and yellow highlighter tools.
            - Smooth 2-finger pinch zoom (1x to 3.5x).
            - Home dashboard with reading progress and saved bookmarks manager.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
