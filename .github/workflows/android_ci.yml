name: Android CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code & Git LFS Assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew app:assembleDebug --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qurafy-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Qurafy-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Qurafy v1.0.${{ github.run_number }}
          body: |
            ## Qurafy Quran Reader App 📖
            
            ### Package Information
            - **Version**: 1.0.${{ github.run_number }}
            - **Target SDK**: Android 11+ (API 30–36)
            
            ### Features
            - Authentic `quran-roman-urdu-hindi.pdf` rendering with LRU bitmap caching.
            - Interactive pencil marking and yellow highlighter tools.
            - Smooth 2-finger pinch zoom (1x to 3.5x).
            - Home dashboard with reading progress and saved bookmarks manager.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
